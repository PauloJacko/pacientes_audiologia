{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Otoscopía - {{ evaluacion.paciente.nombre }}</title>
    <link rel="stylesheet" href="{% static 'evaluaciones/css/audiometria.css' %}">
    <style>
        .otoscopia-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .ear-card { border-radius: 8px; padding: 20px; background: #ffffff; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-top: 5px solid #ccc; }
        .ear-card.od { border-top-color: #e74c3c; }
        .ear-card.oi { border-top-color: #3498db; }
        .form-group { margin-bottom: 15px; }
        .form-control { width: 100%; padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-border; }
    </style>
</head>
<body>

<div class="header">
    <div class="header-left">
        <img src="{% static 'Login/img/logo-png.png' %}" class="logo-header">
        <div class="header-text">
            <span class="title">Editar Otoscopía</span>
            <span class="subtitle">Paciente: {{ evaluacion.paciente.nombre }}</span>
        </div>
    </div>
    <div class="header-right">
        <a href="{% url 'ver_paciente' evaluacion.paciente.id %}" class="btn-back">← Volver</a>
        <a href="{% url 'logout' %}" class="btn-logout">Cerrar sesión</a>
    </div>
</div>

<main class="dashboard-container">
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="otoscopia-grid">
            <!-- OD -->
            <div class="ear-card od">
                <h3 style="color: #e74c3c;">Oído Derecho (O.D.)</h3>
                <div class="form-group">
                    <label>Conducto Auditivo Externo (C.A.E.)</label>
                    <input type="text" name="cae_od" class="form-control" value="{{ otoscopia.cae_od|default:'' }}">
                </div>
                <div class="form-group">
                    <label>Membrana Timpánica</label>
                    <input type="text" name="membrana_od" class="form-control" value="{{ otoscopia.membrana_od|default:'' }}">
                </div>
            </div>

            <!-- OI -->
            <div class="ear-card oi">
                <h3 style="color: #3498db;">Oído Izquierdo (O.I.)</h3>
                <div class="form-group">
                    <label>Conducto Auditivo Externo (C.A.E.)</label>
                    <input type="text" name="cae_oi" class="form-control" value="{{ otoscopia.cae_oi|default:'' }}">
                </div>
                <div class="form-group">
                    <label>Membrana Timpánica</label>
                    <input type="text" name="membrana_oi" class="form-control" value="{{ otoscopia.membrana_oi|default:'' }}">
                </div>
            </div>
        </div>

        <div class="card" style="margin-bottom: 20px; padding: 20px;">
            <div class="form-group">
                <label>Observaciones Generales</label>
                <textarea name="observaciones" class="form-control" rows="3">{{ evaluacion.observaciones|default:'' }}</textarea>
            </div>
            <div class="form-group">
                <label>Archivo Adjunto (Opcional)</label>
                <input type="file" name="archivo" class="form-control">
            </div>
        </div>

        <footer class="form-actions">
            <button type="submit" class="btn-submit">Guardar Cambios</button>
        </footer>
    </form>
</main>

</body>
</html>
